{% if messages %}
  <div class="mb-3">
    {% for message in messages %}
      <div class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
