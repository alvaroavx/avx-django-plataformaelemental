{% if messages %}
  <div class="elemental-notification-stack" aria-label="Notificaciones">
    {% for message in messages %}
      <div
        class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} elemental-notification"
        role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}"
        data-elemental-notification
        data-timeout="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}20000{% else %}10000{% endif %}"
      >
        <div class="elemental-notification-content">{{ message }}</div>
        <button
          type="button"
          class="btn-close elemental-notification-close"
          aria-label="Cerrar notificación"
          data-elemental-notification-close
        ></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
