<script>
  (function (global) {
    if (global.ElementalBusqueda) return;

    const normalizar = function (value) {
      return (value || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    };

    const registrarDataTables = function (jQueryRef) {
      if (!jQueryRef || !jQueryRef.fn || !jQueryRef.fn.dataTable) return;
      const tipos = jQueryRef.fn.dataTable.ext.type.search;
      tipos.string = normalizar;
      tipos.html = function (value) {
        return normalizar((value || "").toString().replace(/<[^>]*>/g, " "));
      };
    };

    const conectarInputDataTable = function (dataTable, input) {
      if (!dataTable || !input) return;
      input.addEventListener("input", function () {
        dataTable.search(normalizar(input.value)).draw();
      });
    };

    const datatablesLanguage = {
      search: "Buscar",
      lengthMenu: "Mostrar _MENU_",
      info: "Mostrando _START_ a _END_ de _TOTAL_",
      infoEmpty: "Mostrando 0 a 0 de 0",
      infoFiltered: "(filtrado de _MAX_ registros totales)",
      zeroRecords: "Sin registros",
      emptyTable: "Sin registros",
      paginate: { previous: "Anterior", next: "Siguiente" },
      aria: {
        sortAscending: ": activar para ordenar ascendente",
        sortDescending: ": activar para ordenar descendente",
      },
    };

    global.ElementalBusqueda = {
      normalizar: normalizar,
      registrarDataTables: registrarDataTables,
      conectarInputDataTable: conectarInputDataTable,
      datatablesLanguage: datatablesLanguage,
    };
  })(window);
</script>
