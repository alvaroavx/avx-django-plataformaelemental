<style>

    --ea-sidebar-bg: #111827;
    --ea-sidebar-text: #e5e7eb;
    --ea-sidebar-muted: #9ca3af;
    --ea-accent: #0f766e;
    --ea-surface: #f6f7f9;
    --ea-panel: #ffffff;
    --ea-panel-soft: #f8fafc;
    --ea-text: #111827;
    --ea-muted: #6b7280;
    --ea-border: #e5e7eb;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ea-sidebar-bg: #0b1220;
    --ea-sidebar-text: #f3f4f6;
    --ea-sidebar-muted: #b3bdcb;
    --ea-accent: #5eead4;
    --ea-surface: #111827;
    --ea-panel: #202b3c;
    --ea-panel-soft: #182438;
    --ea-text: #f3f4f6;
    --ea-muted: #b3bdcb;
    --ea-border: #526077;
  }

  body.elemental-shell {
    min-height: 100vh;
    background: var(--ea-surface);
    color: var(--ea-text);
  }

  body.elemental-shell .btn:not(.btn-close) {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .min-w-0 {
    min-width: 0 !important;
  }

  .elemental-layout {
    min-height: 100vh;
  }

  .elemental-sidebar-desktop {
    width: 280px;
    flex: 0 0 280px;
    min-height: 100vh;
    background: var(--ea-sidebar-bg);
    color: var(--ea-sidebar-text);
    position: sticky;
    top: 0;
    height: 100dvh;
    overflow-y: auto;
  }

  body.elemental-sidebar-ready .elemental-sidebar-desktop {
    transition: width 0.18s ease, flex-basis 0.18s ease;
  }

  .elemental-sidebar-header {
    position: sticky;
    z-index: 3;
    top: 0;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.75rem;
    background: var(--ea-sidebar-bg);
  }

  .elemental-sidebar-toggle {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--ea-sidebar-text);
    background: #253044;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 0.75rem;
  }

  .elemental-sidebar-toggle:hover {
    color: #fff;
    background: #374151;
  }

  .elemental-nav-collapsed-link {
    display: none;
  }

  body.elemental-sidebar-collapsed .elemental-sidebar-desktop {
    width: 84px;
    flex-basis: 84px;
  }

  body.elemental-sidebar-collapsed .elemental-sidebar-toggle {
    margin-inline: auto;
  }

  body.elemental-sidebar-collapsed .elemental-sidebar-header {
    justify-content: center;
    padding-inline: 0.5rem;
  }

  body.elemental-sidebar-collapsed .elemental-sidebar-desktop > .p-3 {
    padding: 0.75rem !important;
  }

  body.elemental-sidebar-collapsed .elemental-sidebar-header .elemental-brand,
  body.elemental-sidebar-collapsed .elemental-nav-heading,
  body.elemental-sidebar-collapsed .elemental-nav-child {
    display: none !important;
  }

  body.elemental-sidebar-collapsed .elemental-nav-link,
  body.elemental-sidebar-collapsed .elemental-nav-collapsed-link {
    width: 52px;
    min-height: 52px;
    margin-inline: auto;
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--ea-sidebar-text);
    text-decoration: none;
    border-radius: 0.85rem;
  }

  body.elemental-sidebar-collapsed .elemental-nav-link > span:not(.elemental-nav-rail-badge) {
    display: none;
  }

  body.elemental-sidebar-collapsed .elemental-nav-collapsed-link:hover,
  body.elemental-sidebar-collapsed .elemental-nav-collapsed-link.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  .elemental-nav-rail-badge {
    min-width: 1.25rem;
    height: 1.25rem;
    display: inline-grid;
    place-items: center;
    padding-inline: 0.25rem;

    background: #facc15;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1;

  body.elemental-sidebar-collapsed .elemental-nav-rail-badge {
    position: absolute;
    top: 0.1rem;
    right: 0.1rem;
  }

  body.elemental-sidebar-collapsed .elemental-nav-link,
  body.elemental-sidebar-collapsed .elemental-nav-collapsed-link {
    position: relative;
  }

    flex: 1 1 0;
    min-width: 0;
    overflow-x: hidden;
  }

  .elemental-brand {

    text-decoration: none;
    letter-spacing: -0.02em;
  }

  .elemental-offcanvas-close {
    position: absolute;

  }

    padding-right: 3rem;
  }

  .elemental-nav-link {

    text-decoration: none;
    display: flex;
    align-items: center;

  .elemental-nav-link:hover,
  .elemental-nav-link.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  .elemental-nav-heading {

    align-items: center;
    gap: 0.65rem;
    padding: 0.8rem 0.85rem 0.35rem;
    color: var(--ea-sidebar-muted);

    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;

  .elemental-nav-heading.active {
    color: var(--ea-sidebar-text);
  }

  .elemental-nav-child {

    color: #fff;
    background: rgba(255, 255, 255, 0.1);

    font-weight: 600;

  .elemental-context-bar {
    position: sticky;
    top: 0;
    z-index: 1020;
    background: color-mix(in srgb, var(--ea-panel) 96%, transparent);
    backdrop-filter: blur(10px);
  }

    min-height: 48px;
  }

  .elemental-context-actions {
    flex: 0 0 auto;
  }

  .elemental-context-toggle {
    flex: 0 0 auto;
    min-width: 44px;
    min-height: 44px;
  }

  .elemental-context-toggle-chevron {
    margin-left: 0.2rem;
    transition: transform 0.18s ease;
  }

  .elemental-context-toggle[aria-expanded="true"] .elemental-context-toggle-chevron {
    transform: rotate(180deg);
  }

  .elemental-content {
    padding: 1rem;
  }

  .elemental-footer {
    color: var(--ea-muted);
    font-size: 0.85rem;
  }

  .elemental-org-logo,

    height: 42px;
    flex: 0 0 42px;
    border-radius: 0.85rem;

    background: #fff;
    border: 1px solid #e5e7eb;
    padding: 0.25rem;

  .elemental-org-fallback {

    align-items: center;
    justify-content: center;
    background: #0f766e;
    color: #fff;
    font-weight: 700;
    letter-spacing: -0.03em;

    background: var(--ea-panel);
    border: 1px solid var(--ea-border);
    border-radius: 0.75rem;
  }

  .elemental-calendar-event {
    background: var(--ea-panel);
    color: var(--ea-text);
  }

    background: var(--ea-panel-soft) !important;
  }

    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .elemental-page-header {
    gap: 0.75rem;
  }

  .elemental-filter-toggle-chevron {
    transition: transform 0.18s ease;
  }

  .elemental-filter-toggle[aria-expanded="true"] .elemental-filter-toggle-chevron {
    transform: rotate(180deg);
  }

  .elemental-page-header > :first-child,
  .elemental-page-title {
    min-width: 0;
  }

  .elemental-calendar-weeks {
    display: flex;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: thin;
    border: 1px solid var(--ea-border);
    border-radius: 0.9rem;
    background: var(--ea-panel);
  }

  .elemental-calendar-week {
    min-width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .elemental-calendar-week-heading {
    position: sticky;
    left: 0;
    padding: 0.75rem 1rem;
    color: var(--ea-muted);
    background: var(--ea-panel-soft);
    border-bottom: 1px solid var(--ea-border);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .elemental-calendar-day {
    display: grid;
    grid-template-columns: minmax(92px, 0.34fr) minmax(0, 1fr);
    min-height: 82px;
    border-bottom: 1px solid var(--ea-border);
  }

  .elemental-calendar-day:last-child {
    border-bottom: 0;
  }

  .elemental-calendar-day-heading,
  .elemental-calendar-day-events {
    padding: 0.75rem;
  }

  .elemental-calendar-day-heading {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    border-right: 1px solid var(--ea-border);
  }

  .elemental-calendar-day-number {
    color: var(--ea-muted);
    font-size: 1.25rem;
    font-weight: 700;
  }

  .elemental-calendar-day-events {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }

  .elemental-calendar-mobile-event {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    padding: 0.65rem 0.75rem;
    color: var(--ea-text);
    text-decoration: none;
    background: var(--ea-panel-soft);
    border: 1px solid var(--ea-border);
    border-radius: 0.65rem;
  }

    .elemental-calendar-month-view {
      display: none;
    }

    .elemental-calendar-month-view.elemental-calendar-month-mobile-visible {
      display: block;
    }

    .elemental-calendar-month-mobile-visible .elemental-calendar {
      min-width: 900px;
    }
  }

  .elemental-date {
    width: 42px;
    flex: 0 0 42px;
    display: grid;
    text-align: center;
    color: var(--ea-muted);
    font-size: 0.72rem;
    line-height: 1;
    text-transform: uppercase;
  }

  .elemental-date strong {
    color: var(--ea-text);
    font-size: 1.2rem;
    line-height: 1.15;
  }

  .elemental-person-summary {
    padding: 1rem;
    background: var(--ea-panel-soft);
    border: 1px solid var(--ea-border);
    border-radius: 0.9rem;
  }

  .elemental-person-metrics {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.6rem;
  }

  .elemental-person-metric {
    min-width: 0;
    padding: 0.7rem 0.8rem;
    background: var(--ea-panel);
    border: 1px solid var(--ea-border);
    border-radius: 0.7rem;
  }

  .elemental-person-metric span,
  .elemental-person-metric strong {
    display: block;
    overflow-wrap: anywhere;
  }

  .elemental-person-recent-item + .elemental-person-recent-item {
    margin-top: 0.65rem;
    padding-top: 0.65rem;
    border-top: 1px solid var(--ea-border);
  }

  .elemental-breakable {
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .elemental-person-identity {
    min-width: 0;
    overflow-wrap: anywhere;
  }

      margin-top: 1rem !important;
    }

    .elemental-page-header {
      align-items: flex-start !important;
      margin-bottom: 0.75rem !important;
    }

    .elemental-page-header h2,
    .elemental-page-title {

      font-size: 1.35rem;

      flex: 0 1 auto;

      overflow-x: auto;
      padding: 0.1rem 0.05rem 0.35rem;
      scrollbar-width: thin;
    }

    .elemental-page-actions > .btn {
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 auto !important;

      flex: 1 1 0 !important;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.4rem 0.2rem;

    .elemental-mobile-action-label {

      line-height: 1.05;
      overflow: hidden;
      text-overflow: ellipsis;
    }

      min-height: 48px;
      justify-content: flex-start !important;
      padding-inline: 0.75rem;
      white-space: normal;
    }

    .elemental-filter-toggle small {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      min-height: 104px;
      padding: 0.75rem;
    }

    .elemental-mobile-kpi .card-body,
    .elemental-metric-card .card-body {
      min-height: 104px;
      padding: 0.75rem;
    }

    .elemental-mobile-kpi .display-6,
    .elemental-metric-card .display-6,
    .elemental-metric-card .h3 {
      margin-bottom: 0.25rem;
      font-size: 1.55rem;
      line-height: 1.1;
    }

    .elemental-summary-metrics .card-title {
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .elemental-summary-metrics .display-6 {
      margin-bottom: 0;
      font-size: 1.65rem;
      line-height: 1;
    }

    .elemental-summary-actions .btn {

      padding: 0.45rem;
      font-size: 1rem;
    }

    .elemental-person-metrics {
      grid-template-columns: 1fr;

    outline: 3px solid var(--ea-accent);
    outline-offset: 3px;
  }

  .elemental-theme-toggle {
    min-width: 44px;
    min-height: 44px;
  }

  }
