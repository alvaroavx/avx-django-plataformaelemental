{% load static %}
<script>
  (function () {
    try {
      if (window.localStorage.getItem("elemental-sidebar-collapsed") === "true") {
        document.body.classList.add("elemental-sidebar-collapsed");
      }
    } catch (_error) {
      // La preferencia local es opcional; el menú inicia expandido si no está disponible.
    }
  })();
</script>
<aside class="elemental-sidebar-desktop d-none d-lg-block" id="elementalSidebarDesktop">
  <div class="elemental-sidebar-header">
    <a class="elemental-brand d-flex align-items-center gap-2" href="{% url 'elemental_apps' %}" title="Elemental Apps">
      <img src="{% static 'img/isotipo-blanco.png' %}" alt="" width="34" height="34">
      <span class="fw-bold">Elemental Apps</span>
    </a>
    <button class="elemental-sidebar-toggle" type="button" data-elemental-sidebar-toggle aria-controls="elementalSidebarDesktop" aria-expanded="true" title="Contraer menú">
      <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
      <span class="visually-hidden">Contraer menú</span>
    </button>
  </div>
  {% include "shared/_sidebar_nav.html" with hide_sidebar_brand=True %}
</aside>

<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="elementalSidebar" aria-labelledby="elementalSidebarLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="elementalSidebarLabel">Elemental Apps</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body p-0">
    {% include "shared/_sidebar_nav.html" %}
  </div>
</div>
