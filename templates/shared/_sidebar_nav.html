{% load static %}
<div class="p-3">
  <a class="elemental-brand d-flex align-items-center gap-2 mb-4" href="{% url 'elemental_apps' %}">
    <img src="{% static 'img/isotipo-blanco.png' %}" alt="" width="34" height="34">
    <span class="fw-bold">Elemental Apps</span>
  </a>
  <nav class="d-flex flex-column gap-1" aria-label="Navegación principal">
    {% for item in elemental_nav_items %}
      {% if item.children %}
        <div class="elemental-nav-heading {% if item.active %}active{% endif %}">
          <i class="bi {{ item.icon }}" aria-hidden="true"></i><span>{{ item.label }}</span>
        </div>
        <a class="elemental-nav-collapsed-link {% if item.active %}active{% endif %}" href="{{ item.url }}" title="{{ item.label }}">
          <i class="bi {{ item.icon }}" aria-hidden="true"></i><span class="visually-hidden">{{ item.label }}</span>
        </a>
        <div class="d-flex flex-column mb-2" role="group" aria-label="{{ item.label }}">
          {% for child in item.children %}
            <a class="elemental-nav-child {% if child.current %}active{% endif %}" href="{{ child.url }}" {% if child.current %}aria-current="page"{% endif %}>
              <i class="bi {{ child.icon }}" aria-hidden="true"></i><span>{{ child.label }}</span>
              {% if child.badge %}<span class="badge rounded-pill text-bg-warning ms-auto" aria-label="{{ child.badge }} solicitudes pendientes">{{ child.badge }}</span>{% endif %}
            </a>
          {% endfor %}
        </div>
      {% else %}
        <a class="elemental-nav-link {% if item.active %}active{% endif %}" href="{{ item.url }}" {% if item.current %}aria-current="page"{% endif %}>
          <i class="bi {{ item.icon }}" aria-hidden="true"></i><span>{{ item.label }}</span>
        </a>
      {% endif %}
    {% endfor %}
  </nav>
</div>
