name: release asistencias automatico

on:
  push:
    tags:
      - "release/asistencias-*"

concurrency:
  group: release-asistencias-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: production-readonly
    steps:
      - name: Checkout exacto del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verificar tag, SHA y padre
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          RELEASE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          RELEASE_PARENT="$(git rev-parse "${RELEASE_SHA}^")"
          printf 'RELEASE_SHA=%s\nRELEASE_PARENT=%s\n' "$RELEASE_SHA" "$RELEASE_PARENT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - name: Preparar SSH readonly con host verificado
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keygen -y -f ~/.ssh/release_key >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Preflight remoto sin downtime
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "preflight --tag ${RELEASE_TAG} --sha ${RELEASE_SHA} --parent ${RELEASE_PARENT}"

  apply:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout exacto del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verificar identidad del release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          RELEASE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          RELEASE_PARENT="$(git rev-parse "${RELEASE_SHA}^")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf 'RELEASE_SHA=%s\nRELEASE_PARENT=%s\n' "$RELEASE_SHA" "$RELEASE_PARENT" >> "$GITHUB_ENV"
      - name: Preparar SSH apply con host verificado
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keygen -y -f ~/.ssh/release_key >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Apply escalonado automático
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "apply --tag ${RELEASE_TAG} --sha ${RELEASE_SHA} --parent ${RELEASE_PARENT}"
