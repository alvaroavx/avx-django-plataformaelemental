name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Tag o hash exacto que se probará y desplegará"
        required: true
        type: string
      confirmacion:
        description: "Escribir DESPLEGAR_PRODUCCION para habilitar el job protegido"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
    env:
      DJANGO_ENV: dev
      POSTGRES_DB: plataforma_elemental_dev
      POSTGRES_USER: elementos
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      GOOGLE_AUTH_ENABLED: "false"
      ACCESS_REQUESTS_ENABLED: "false"
      ACCESS_REQUEST_APPROVAL_ENABLED: "false"
      GOOGLE_AUTH_ENFORCED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plataforma_elemental_dev
          POSTGRES_USER: elementos
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elementos -d plataforma_elemental_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}

      - name: Verify release deploy protocol
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          grep -Fq 'DEPLOY_ALLOW_FULL_MIGRATE' scripts/deploy.sh
          grep -Fq 'DEPLOY_EXPECTED_COMMIT' scripts/deploy.sh
          if grep -Fq 'MANUAL_RELEASE_ONLY=1' scripts/release_operacion_profesor.sh 2>/dev/null; then
            echo "Este release exige su runbook manual por etapas." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check .

      - name: Run test suite
        run: python manage.py test

      - name: Resolve tested release commit
        id: release
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmacion == 'DESPLEGAR_PRODUCCION' }}
    environment:
      name: production

    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEPLOY_VENV_DIR: ${{ secrets.DEPLOY_VENV_DIR }}
          DEPLOY_PYTHON_BIN: ${{ secrets.DEPLOY_PYTHON_BIN }}
          DEPLOY_BACKUP_DIR: ${{ secrets.DEPLOY_BACKUP_DIR }}
        run: |
          set -euo pipefail

          missing=0

          # Validamos antes de abrir SSH para fallar con un mensaje claro cuando falte un secret esencial.
          for required_var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY_B64 DEPLOY_PATH DEPLOY_SERVICE DEPLOY_ENV_FILE DEPLOY_BACKUP_DIR; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Falta el secret requerido ${required_var}. El deploy no puede continuar sin ese valor." >&2
              missing=1
            fi
          done

          # Estas variables son opcionales porque scripts/deploy.sh ya soporta valores vacios
          # y aplica defaults internos.
          # DEPLOY_PORT tambien es opcional: si no existe, el workflow usa el puerto 22.
          # Opcionales:
          # - DEPLOY_VENV_DIR
          # - DEPLOY_PYTHON_BIN
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s" "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEPLOY_VENV_DIR: ${{ secrets.DEPLOY_VENV_DIR }}
          DEPLOY_PYTHON_BIN: ${{ secrets.DEPLOY_PYTHON_BIN }}
          DEPLOY_BACKUP_DIR: ${{ secrets.DEPLOY_BACKUP_DIR }}
          RELEASE_COMMIT: ${{ needs.test.outputs.release_commit }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          # -i ~/.ssh/deploy_key evita depender del nombre por defecto de OpenSSH
          # y asegura que el workflow use exactamente la clave exclusiva de deploy.
          # StrictHostKeyChecking=yes mantiene la validacion del host remoto contra known_hosts.
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          test -z "\$(git status --porcelain)"
          previous_commit="\$(git rev-parse HEAD)"
          git fetch --prune --tags origin
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          resolved_commit="\$(git rev-parse "${RELEASE_COMMIT}^{commit}")"
          test "\$resolved_commit" = "${RELEASE_COMMIT}"
          git checkout --detach "${RELEASE_COMMIT}"
          test "\$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          export DEPLOY_SERVICE="${DEPLOY_SERVICE}"
          export DEPLOY_ENV_FILE="${DEPLOY_ENV_FILE}"
          export DEPLOY_VENV_DIR="${DEPLOY_VENV_DIR}"
          export DEPLOY_PYTHON_BIN="${DEPLOY_PYTHON_BIN}"
          export DEPLOY_BACKUP_DIR="${DEPLOY_BACKUP_DIR}"
          export DEPLOY_EXPECTED_COMMIT="${RELEASE_COMMIT}"
          export DEPLOY_PREVIOUS_COMMIT="\$previous_commit"
          export DEPLOY_ALLOW_FULL_MIGRATE="FULL_MIGRATE_APPROVED"
          bash scripts/deploy.sh
          EOF

      - name: Healthcheck production
        run: |
          set -euo pipefail
          curl -fsSI --retry 5 --retry-delay 2 --retry-all-errors https://apps.espacioelementos.cl/ >/dev/null
